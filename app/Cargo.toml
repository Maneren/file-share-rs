[package]
name = "file-share-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
leptos_router_macro.workspace = true
leptos_axum = { workspace = true, optional = true }

chrono.workspace = true
chrono-humanize.workspace = true
cfg-if.workspace = true
http.workspace = true
include-flate.workspace = true
nucleo = { workspace = true, optional = true }
rust-embed.workspace = true
serde_json.workspace = true
serde.workspace = true
server_fn.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
urlencoding.workspace = true
wasm-bindgen.workspace = true
web-sys.workspace = true
web-time.workspace = true

[features]
default = []
# `rust-embed/debug-embed`: icon files must be compile-time embedded —
# WASM has no filesystem for dev-mode disk reads. Scoped to `hydrate`
# so the server keeps dynamic reads in dev.
hydrate = ["leptos/hydrate", "rust-embed/debug-embed"]
ssr = [
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "dep:leptos_axum",
  "dep:nucleo",
  "dep:tokio",
]
