cargo-features = ["codegen-backend"]

[workspace.package]
edition = "2024"
authors = ["Maneren <maneren731@gmail.com>"]
version = "1.7.1"
license = "MIT"
repository = "https://github.com/Maneren/file-share-rs"
description = "Fast Rust-powered HTTP file server with beautiful web-based GUI"
rust-version = "1.98.0"

[workspace]
resolver = "2"
members = ["app", "frontend", "server"]

[workspace.dependencies]
leptos = { version = "0.8", features = ["nightly", "islands"] }
leptos_axum = "0.8"
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8", features = ["nightly"] }
leptos_router_macro = { version = "0.8" }
server_fn = { version = "0.8", features = ["multipart"] }

async-compression = { version = "0.4", features = ["tokio", "gzip", "zstd"] }
async-walkdir = "2.0"
async_zip = { version = "0.0.19", features = ["deflate", "tokio"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-server = "0.8"
cfg-if = "1"
chrono = "0.4"
chrono-humanize = "0.2"
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
console_error_panic_hook = "0.1"
console_log = "1"
futures = "0.3"
http = "1.1"
if-addrs = "0.15"
include-flate = { version = "0.3", default-features = false, features = [
  "zstd",
] }
log = "0.4"
nucleo = "0.5"
port_check = "0.3"
qr_code = "2.0"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
rust-embed = { version = "8.4", features = ["mime-guess", "compression"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1.38", features = [
  "macros",
  "rt-multi-thread",
  "fs",
  "io-util",
  "signal",
  "sync",
  "time",
] }
tokio-stream = "0.1"
tokio-tar = "0.3"
tokio-util = { version = "0.7", features = ["io", "compat"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = [
  "async-compression",
  "fs",
  "set-header",
  "catch-panic",
  "limit",
  "compression-br",
  "compression-gzip",
  "compression-zstd",
] }
urlencoding = "2"
wasm-bindgen = "0.2"
web-sys = { version = "0.3.70", features = [
  "File",
  "FileList",
  "FormData",
  "HtmlFormElement",
  "HtmlInputElement",
  "ProgressEvent",
  "XmlHttpRequest",
  "XmlHttpRequestUpload",
] }
web-time = "1.1"

[profile.dev]
incremental = true
codegen-units = 256
split-debuginfo = "unpacked"

[profile.dev.package.file-share]
codegen-backend = "cranelift"

[profile.dev.package.leptos_macro]
opt-level = 3

[workspace.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }_{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = "thin"
panic = "abort"

[profile.release]
strip = true

[[workspace.metadata.leptos]]
name = "file-share"
assets-dir = "app/public"
lib-profile-release = "wasm-release"
tailwind-input-file = "app/styles/tailwind.css"
site-addr = "127.0.0.1:18765"

bin-package = "file-share"
lib-package = "file-share-frontend"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Truly impractical to fix across the codebase
module_name_repetitions = "allow"
# Originate inside Leptos `#[component]`/`#[island]` macro expansions,
# not in user code
empty_enums = "allow"
mem_forget = "allow"
absolute_paths = "allow"

# Chosen lints from restriction group
unused_trait_names = "warn"

# Don't Panic - prevent panics from unwraps and unsafe slicing or indexing
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"

# Don't Fail Silently - prevent dropped futures and swallowed errors
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Don't Do Bad Async Stuff - prevent deadlocks and concurrency bugs
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
large_futures = "warn"

# Don't Do Unsafe Things with Memory
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

# Don't Do Potentially Incorrect Things with Numbers
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_possible_truncation = "warn"

# Don't Do Bad Things That are Easy to Avoid
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

# Don't `allow` Your Way Around These Lints - every suppression must be
# a deliberate #[expect(..., reason = "…")] rather than a silent #[allow]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
