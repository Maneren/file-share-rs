[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.i686-unknown-linux-gnu]
linker = "i686-linux-gnu-gcc"

[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[unstable]
codegen-backend = true

[build]
# -Csymbol-mangling-version=v0: faster non-incremental builds (already set)
# -Zunstable-options --jobs=0: enable parallel frontend/backend (threaded compilation)
#   --jobs=0 uses all logical CPUs (0 = auto)
rustflags = ["-Csymbol-mangling-version=v0", "-Zunstable-options", "--jobs=0"]
incremental = true
pipelining = true
